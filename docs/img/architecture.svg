<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Peacock OS layered architecture"><rect width="900" height="440" rx="14" fill="#f8fafc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="40" y="20" width="820" height="56" rx="10" fill="#7c3aed" fill-opacity=".16" stroke="#7c3aed" stroke-width="2"/><text x="450.0" y="46.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Applications</text><text x="450.0" y="63.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">Files - Browser - Terminal - Notes - Settings - App Builder - 3D Studio - Paint - ...</text><rect x="40" y="90" width="820" height="56" rx="10" fill="#2563eb" fill-opacity=".16" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="116.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Desktop shell</text><text x="450.0" y="133.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">windows - dock - top bar - launcher - glass panels - themes - damage rects</text><rect x="40" y="160" width="820" height="56" rx="10" fill="#0891b2" fill-opacity=".16" stroke="#0891b2" stroke-width="2"/><text x="450.0" y="186.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Graphics</text><text x="450.0" y="203.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">64-bit RGBA16 back buffer - fonts - SVG - 3D rasteriser - dithered flush</text><rect x="40" y="230" width="820" height="56" rx="10" fill="#059669" fill-opacity=".16" stroke="#059669" stroke-width="2"/><text x="450.0" y="256.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Services</text><text x="450.0" y="273.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">KCFS 2 store - threads - TCP/IP + DHCP + DNS - HTTP/HTML - .pea loader</text><rect x="40" y="300" width="820" height="56" rx="10" fill="#d97706" fill-opacity=".16" stroke="#d97706" stroke-width="2"/><text x="450.0" y="326.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Drivers and buses</text><text x="450.0" y="343.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">PCI - ACPI - USB UHCI (HID, mass storage) - RTL8139 - ATA - PS/2 - VBE/DISPI - serial</text><rect x="40" y="370" width="820" height="56" rx="10" fill="#dc2626" fill-opacity=".16" stroke="#dc2626" stroke-width="2"/><text x="450.0" y="396.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Boot</text><text x="450.0" y="413.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">stage 1 (MBR) - stage 2 (A20, E820, protected to long mode) - kernel at 2 MiB</text></svg>