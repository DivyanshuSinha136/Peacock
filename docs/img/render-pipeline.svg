<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="64-bit rendering pipeline"><rect width="1000" height="200" rx="14" fill="#f8fafc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="20" y="40" width="140" height="70" rx="10" fill="#7c3aed" fill-opacity=".16" stroke="#7c3aed" stroke-width="2"/><text x="90.0" y="73.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Apps / widgets</text><text x="90.0" y="90.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">draw 8-bit colours</text><path d="M160 75L185 75" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="185" y="40" width="140" height="70" rx="10" fill="#2563eb" fill-opacity=".16" stroke="#2563eb" stroke-width="2"/><text x="255.0" y="73.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Back buffer</text><text x="255.0" y="90.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">*u64  A:R:G:B 16 bit each</text><path d="M325 75L350 75" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="40" width="140" height="70" rx="10" fill="#0891b2" fill-opacity=".16" stroke="#0891b2" stroke-width="2"/><text x="420.0" y="73.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Glass + blend</text><text x="420.0" y="90.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">mixp / mixpp in 16-bit</text><path d="M490 75L515 75" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="515" y="40" width="140" height="70" rx="10" fill="#059669" fill-opacity=".16" stroke="#059669" stroke-width="2"/><text x="585.0" y="73.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Damage rects</text><text x="585.0" y="90.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">only dirty areas</text><path d="M655 75L680 75" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="40" width="140" height="70" rx="10" fill="#d97706" fill-opacity=".16" stroke="#d97706" stroke-width="2"/><text x="750.0" y="73.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">flush</text><text x="750.0" y="90.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">Bayer dither to 24/32 bpp</text><path d="M820 75L845 75" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="845" y="40" width="140" height="70" rx="10" fill="#dc2626" fill-opacity=".16" stroke="#dc2626" stroke-width="2"/><text x="915.0" y="73.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">VBE/DISPI LFB</text><text x="915.0" y="90.0" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#334155">up to 4096x2400</text><text x="20" y="150" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">Blending and glass blur keep 16 bits per channel, so gradients and translucent layers do not band.</text><text x="20" y="172" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">Pixels that are exactly representable in 8 bits skip dithering (fast path). Output depth is limited by the display hardware.</text></svg>